<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="{{csp}}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PlantUML Interactive Diagram</title>
{{styleLinks}}
	<style>
		/* The app's CSS is written for the web page's two-pane shell. Here the
		   diagram is the whole panel, so undo the parts that assume a shell. */
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background-color: var(--vscode-editor-background);
			color: var(--vscode-editor-foreground);
			font-family: var(--vscode-font-family);
		}
		#colb-container {
			position: absolute;
			inset: 0;
			/* hidden, not auto: panzoom translates #colb, so a scrollbar here
			   would fight the drag gesture. */
			overflow: hidden;
		}
		#colb {
			padding: 12px;
			transform-origin: 0 0;
		}
		#colb svg {
			max-width: none;
		}
		/* The VS Code text editor is the source editor. #editor exists only
		   because hover-highlight.js reads editor.container, and #version /
		   #version-panel only because script.js registers a document click
		   handler that dereferences them. */
		#editor, #version, #version-panel {
			display: none !important;
		}
		#popup {
			visibility: hidden;
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			z-index: 5000;
			padding: 8px 12px;
			background: var(--vscode-inputValidation-errorBackground);
			color: var(--vscode-errorForeground);
			border-bottom: 1px solid var(--vscode-inputValidation-errorBorder);
			white-space: pre-wrap;
			font-family: var(--vscode-editor-font-family);
			font-size: 12px;
		}
		#loading-overlay {
			display: none;
			position: absolute;
			inset: 0;
			background: rgba(0, 0, 0, 0.08);
			z-index: 4000;
		}
	</style>
</head>
<body>
	<!-- The seven ids the app's code dereferences without a null check and that
	     the menu partials do not supply. One missing id throws during setup and
	     kills every interaction while the diagram still renders. -->
	<div id="popup">Error message</div>
	<div id="editor"></div>
	<span id="version"></span>
	<div id="version-panel"></div>

	<div id="colb-container">
		<div id="colb"></div>
		<div id="loading-overlay"></div>
	</div>

{{menus}}

	<script nonce="{{nonce}}">
		// Read by fetchShim.js, which every relative fetch() in the app's code
		// goes through.
		window.__PLANTUML_API__ = {{apiBase}};
		window.__PLANTUML_TOKEN__ = {{token}};
	</script>
{{scripts}}
</body>
</html>
